name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          # stop the build on syntax errors or undefined names
          flake8 lib/ tools/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # treat all other issues as warnings
          flake8 lib/ tools/ --count --max-line-length=120 --statistics --exit-zero

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Relax legacy pins that have no wheels for Python 3.9+
          sed -e 's/opencv-python==3.4.1.15/opencv-python/' \
              -e 's/shapely==1.6.4/shapely/' \
              requirements.txt | pip install -r /dev/stdin
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pycocotools

      - name: Build NMS extension
        run: |
          cd lib && make

      - name: Verify imports
        run: |
          cd tools && python -c "import _init_paths; from config import cfg; print('Config loaded:', cfg.MODEL.NAME)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config --quiet
