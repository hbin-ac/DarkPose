name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # stop the build on syntax errors or undefined names
          flake8 lib/ tools/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # treat all other issues as warnings
          flake8 lib/ tools/ --count --max-line-length=120 --statistics --exit-zero

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch==1.0.1 torchvision==0.3.0 -f https://download.pytorch.org/whl/cpu/torch_stable.html
          pip install pycocotools

      - name: Build NMS extension
        run: |
          cd lib && make

      - name: Verify imports
        run: |
          cd tools && python -c "import _init_paths; from config import cfg; print('Config loaded:', cfg.MODEL.NAME)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config --quiet
